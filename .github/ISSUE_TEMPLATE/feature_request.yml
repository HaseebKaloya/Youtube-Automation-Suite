name: "Feature Request"
description: "Suggest an improvement, new capability, or workflow idea."
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: "Problem or Motivation"
      description: "Is this feature related to a current limitation or a specific use case?"
      placeholder: "I currently need a way to..."
    validations:
      required: true

  - type: textarea
    id: proposed_solution
    attributes:
      label: "Proposed Solution"
      description: "Describe how you envision this feature functioning."
      placeholder: "Add an option to..."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: "Alternatives Considered"
      description: "Any alternative approaches or workarounds you have considered."
